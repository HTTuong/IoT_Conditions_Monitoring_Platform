<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Device Detail</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #f5f5f5; }
    h1 { font-size: 1.3rem; }
    a.back-link { display: inline-block; margin-bottom: 1rem; color: #333; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 2rem; background: white; }
    th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; font-size: 0.9rem; }
    th { background: #333; color: white; }
    .anomaly { background: #fff3f3; color: #c00; font-weight: bold; }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">&larr; Back to device list</a>
  <h1 id="device-title">Device Detail</h1>

  <h2>Telemetry History</h2>
  <table id="telemetry-table">
    <thead><tr><th>Timestamp</th><th>Temperature</th><th>Vibration</th><th>Battery</th><th>Connectivity</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>Alerts for this device</h2>
  <table id="alerts-table">
    <thead><tr><th>Type</th><th>Message</th><th>Resolved</th><th>Created</th></tr></thead>
    <tbody></tbody>
  </table>

  <script src="device-detail.js"></script>
</body>
</html>
